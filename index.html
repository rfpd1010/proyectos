<script>
    // REEMPLAZÁ ESTOS DOS VALORES POR LOS DE TU PROYECTO

    const SUPABASE_URL = https://pznculgjwextsrgyxufg.supabase.co/rest/v1/;
    const SUPABASE_KEY = sb_publishable_OBeSRP1Syio6IIjZXq8EXQ_Qu2wawYZ;

    const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    // MOSTRAR LA SECCIÓN CORRESPONDIENTE

    function mostrarAplicacion(sesion) {
        document.getElementById("acceso").classList.toggle("oculto", sesion);
        document.getElementById("aplicacion").classList.toggle("oculto", !sesion);
    }

    // REGISTRARSE

    async function registrarse() {
        const correo = document.getElementById("correo").value;
        const contrasena = document.getElementById("contrasena").value;
        const mensaje = document.getElementById("mensajeAcceso");

        if (!correo || !contrasena) {
            mensaje.textContent = "Completá el correo y la contraseña.";
            return;
        }

        const { data, error } = await db.auth.signUp({
            email: correo,
            password: contrasena,
            options: {
                emailRedirectTo: "https://rfpd1010.github.io/proyectos/"
            }
        });

        if (error) {
            mensaje.textContent = error.message;
            return;
        }

        mensaje.textContent = data.session
            ? "Cuenta creada correctamente."
            : "Cuenta creada. Revisá tu correo para confirmar el registro.";
    }

    // INICIAR SESIÓN

    async function iniciarSesion() {
        const correo = document.getElementById("correo").value;
        const contrasena = document.getElementById("contrasena").value;
        const mensaje = document.getElementById("mensajeAcceso");

        const { error } = await db.auth.signInWithPassword({
            email: correo,
            password: contrasena
        });

        if (error) {
            mensaje.textContent = error.message;
        }
    }

    // CERRAR SESIÓN

    async function cerrarSesion() {
        await db.auth.signOut();
    }

    // CALCULADORA

    async function calcular() {

        const gananciaTexto = document.getElementById("ganancia").value;
        const perdidaTexto = document.getElementById("perdida").value;
        const anteriorTexto = document.getElementById("anterior").value;

        if (
            gananciaTexto === "" ||
            perdidaTexto === "" ||
            anteriorTexto === ""
        ) {
            alert("Completá todos los campos.");
            return;
        }

        const ganancia = Number(gananciaTexto);
        const perdida = Number(perdidaTexto);
        const anterior = Number(anteriorTexto);

        if (
            !Number.isFinite(ganancia) ||
            !Number.isFinite(perdida) ||
            !Number.isFinite(anterior) ||
            ganancia < 0 || perdida < 0 || anterior < 0
        ) {
            alert("Ingresá números válidos y no negativos.");
            return;
        }

        const ganancia_neta = ganancia - perdida;
        const diferencia = ganancia_neta - anterior;

        let resultado = "";

        if (anterior !== 0) {
            const porcentaje = (diferencia / anterior) * 100;
            resultado += "Cambio: " + porcentaje.toFixed(2) + "%<br>";
        } else {
            resultado += "No se puede calcular el porcentaje porque ayer no hubo ganancias.<br>";
        }

        resultado += "Ganancia neta de hoy: $" + ganancia_neta + "<br>";

        if (ganancia_neta > anterior) {
            resultado += "Tu ganancia fue mayor que ayer.<br>";
        } else if (ganancia_neta < anterior) {
            resultado += "Tu ganancia fue menor que ayer.<br>";
        } else {
            resultado += "Tu ganancia fue igual que ayer.<br>";
        }

        const ganancia_total = ganancia_neta + anterior;

        resultado += "Ganancia total: $" + ganancia_total;

        document.getElementById("resultado").innerHTML = resultado;

        // GUARDAR EN SUPABASE

        const { error } = await db
            .from("ganancias")
            .insert({
                ganancia: ganancia,
                publicidad: perdida,
                ganancia_neta: ganancia_neta
            });

        if (error) {
            alert("No se pudo guardar: " + error.message);
            return;
        }

        alert("¡Ganancia guardada correctamente!");

        cargarHistorial();
    }

    // HISTORIAL DE GANANCIAS

    async function cargarHistorial() {

        const contenedor = document.getElementById("historial");
        contenedor.textContent = "Cargando historial...";

        const { data, error } = await db
            .from("ganancias")
            .select("fecha, ganancia, publicidad, ganancia_neta")
            .order("created_at", { ascending: false })
            .limit(30);

        if (error) {
            contenedor.textContent = "Error al cargar el historial: " + error.message;
            return;
        }

        contenedor.replaceChildren();

        if (data.length === 0) {
            contenedor.textContent = "Todavía no tenés ganancias registradas.";
            return;
        }

        data.forEach(registro => {
            const elemento = document.createElement("div");
            elemento.className = "registro";

            const fecha = document.createElement("strong");
            fecha.textContent = registro.fecha;

            const detalle = document.createElement("p");
            detalle.textContent =
                "Ganancia: $" + registro.ganancia +
                " | Publicidad: $" + registro.publicidad +
                " | Neto: $" + registro.ganancia_neta;

            elemento.append(fecha, detalle);
            contenedor.appendChild(elemento);
        });
    }

    // COMPROBAR SI YA HAY UNA SESIÓN

    db.auth.onAuthStateChange((evento, sesion) => {
        mostrarAplicacion(!!sesion);

        if (sesion) {
            document.getElementById("usuario").textContent =
                "Sesión iniciada: " + sesion.user.email;

            cargarHistorial();
        }
    });

    // COMPROBAR SESIÓN AL ABRIR LA PÁGINA

    db.auth.getSession().then(({ data }) => {
        mostrarAplicacion(!!data.session);

        if (data.session) {
            document.getElementById("usuario").textContent =
                "Sesión iniciada: " + data.session.user.email;

            cargarHistorial();
        }
    });

</script>

</body>
</html>
